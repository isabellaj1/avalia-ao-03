<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BEAUTYSTORE - Entrar</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Arial, Helvetica, sans-serif;
        }

        body {
            background-color: #f6f6f8;
            color: #18181b;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .top-bar {
            background: linear-gradient(90deg, #a80015 0%, #d90429 100%);
            color: #ffffff;
            font-size: 0.78rem;
            font-weight: 600;
            padding: 0.55rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .cupom {
            background-color: #ffffff;
            color: #c9001a;
            padding: 2px 10px;
            border-radius: 999px;
            font-size: 0.74rem;
            font-weight: 800;
        }

        header {
            background-color: #ffffff;
            padding: 1.15rem 2rem;
            border-bottom: 1px solid #e4e4e7;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .header-container {
            max-width: 1180px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.6rem;
            font-weight: 900;
            letter-spacing: 3.5px;
            color: #111111;
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            gap: 1.6rem;
            align-items: center;
        }

        .nav-links a {
            text-decoration: none;
            color: #27272a;
            font-weight: 700;
            font-size: 0.85rem;
            padding-bottom: 4px;
            border-bottom: 2px solid transparent;
        }

        .nav-links a:hover, .nav-links a.active {
            color: #c9001a;
            border-bottom-color: #c9001a;
        }

        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 3rem 1.5rem;
        }

        .auth-container {
            background: #ffffff;
            width: 100%;
            max-width: 420px;
            padding: 2.5rem;
            border: 1px solid #e4e4e7;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04);
        }

        .auth-container h2 {
            margin-bottom: 1.5rem;
            text-align: center;
            color: #111111;
            font-size: 1.4rem;
            font-weight: 800;
            text-transform: uppercase;
        }

        .form-group {
            margin-bottom: 1.2rem;
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .form-group label {
            font-size: 0.85rem;
            font-weight: 700;
            color: #27272a;
        }

        .form-group input {
            padding: 0.75rem;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 0.9rem;
            outline: none;
        }

        .form-group input:focus {
            border-color: #c9001a;
        }

        .btn-submit {
            width: 100%;
            padding: 0.8rem;
            background-color: #c9001a;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            font-size: 0.95rem;
            font-weight: 800;
            cursor: pointer;
            margin-top: 0.5rem;
            transition: background-color 0.2s ease;
        }

        .btn-submit:hover {
            background-color: #111111;
        }

        footer {
            background-color: #111111;
            color: #a1a1aa;
            text-align: center;
            padding: 1.3rem;
            font-size: 0.8rem;
            margin-top: auto;
        }
    </style>
</head>
<body>
    <div class="top-bar">
        <span>FRETE GRÁTIS nas compras acima de R$ 199</span>
        <span>CUPOM: <strong class="cupom">MEUMIMO</strong></span>
    </div>

    <header>
        <div class="header-container">
            <a href="index.html" class="logo">BEAUTYSTORE</a>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="produto.html">Catálogo</a>
                <a href="login.html" class="active">Entrar</a>
                <a href="new.html">Criar Conta</a>
            </div>
        </div>
    </header>

    <main>
        <div class="auth-container">
            <h2>Acesse sua Conta</h2>
            
            <!-- Formulário com ação submit ao pressionar Enter -->
            <form id="formLogin" action="produto.html" method="GET">
                <div class="form-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" placeholder="Digite seu e-mail" required>
                </div>

                <div class="form-group">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" placeholder="Digite sua senha" required>
                </div>

                <button type="submit" class="btn-submit">ENTRAR</button>
            </form>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 BEAUTYSTORE Cosméticos S.A. Todos os direitos reservados.</p>
    </footer>

    <script>
        // Garante que o Enter submeta o formulário e redirecione diretamente para o catálogo
        document.getElementById('formLogin').addEventListener('submit', function(event) {
            event.preventDefault();
            window.location.href = 'produto.html';
        });
    </script>
</body>
